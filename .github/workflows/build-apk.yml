name: Build Android APK (Parya Rubika Music Bot)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-panel-apk:
    name: Build Android Panel + Termux APK (Fast)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'


      - name: Install Android SDK Platform 34
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Panel + Termux APK
        working-directory: android_webview_apk
        run: gradle assembleDebug --no-daemon

      - name: Upload Panel APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParyaRubikaPanel-APK
          path: android_webview_apk/app/build/outputs/apk/debug/*.apk

      - name: Publish Panel APK Release
        uses: softprops/action-gh-release@v2
        with:
          files: android_webview_apk/app/build/outputs/apk/debug/*.apk
          tag_name: v1.0.${{ github.run_number }}
          name: Parya Rubika APK v1.0.${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

