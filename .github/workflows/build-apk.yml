name: Build Android APK (Parya Rubika Music Bot)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-panel-apk:
    name: Build Android Panel + Termux APK (Fast)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 34
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Panel + Termux APK
        working-directory: android_webview_apk
        run: gradle assembleDebug --no-daemon

      - name: Upload Panel APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParyaRubikaPanel-APK
          path: android_webview_apk/app/build/outputs/apk/debug/*.apk

      - name: Publish Panel APK Release
        uses: softprops/action-gh-release@v2
        with:
          files: android_webview_apk/app/build/outputs/apk/debug/*.apk
          tag_name: v1.0.${{ github.run_number }}
          name: Parya Rubika APK v1.0.${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-kivy-apk:
    name: Build Standalone Python Kivy APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies for Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake

      - name: Copy bot core into mobile_apk
        run: |
          cp bot/rubika_music_bot.py mobile_apk/rubika_music_bot.py

      - name: Cache Buildozer directory
        uses: actions/cache@v4
        with:
          path: mobile_apk/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('mobile_apk/buildozer.spec') }}

      - name: Build Android APK with Buildozer
        working-directory: mobile_apk
        run: |
          pip install --upgrade pip "setuptools<70" wheel buildozer cython==0.29.36 appdirs sh packaging
          yes | buildozer -v android debug

      - name: Upload Kivy APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParyaRubikaBot-Kivy-APK
          path: mobile_apk/bin/*.apk
